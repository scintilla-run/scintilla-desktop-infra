version = 1
product = "scintilla"
profile = "single-host-desktop-v1"
ready = false
ingress_url = "http://127.0.0.1:8083"
daemon_url = "http://127.0.0.1:9588"
default_proxy = "cloudflared"
reverse_proxy_required = false
promotion_blocker = "desktop daemon and dedicated BEAM ingress/control adapter must be executable and CI-green"

[[component]]
name = "desktop-daemon"
repo = "https://github.com/scintilla-run/scintilla-desktop-daemon.git"
rev = "b67ec249229de6d0a8d298e728e49a397d0ec980"
status = "blocked"
build = "cargo build --release"

[[component]]
name = "beam-runner"
repo = "https://github.com/scintilla-run/gleam-lambda-runner.git"
rev = "8c427f8b77403b1534753639aa06fb6057268c6d"
status = "promoted"
build = "rebar3 compile"

[[component]]
name = "cli"
repo = "https://github.com/scintilla-run/scintilla-cli.git"
rev = "293548d5eb550f0fc8cff66bfc6b29365648c951"
status = "promoted"
build = "cargo build --release"

[workers]
native = true
containers = true
languages = ["typescript", "python", "rust", "go"]

[security]
daemon_bind = "loopback-only"
daemon_auth = "bearer-token-local-file"
cloudflare_credentials = "external-local-store"
plaintext_secrets_in_repo = false
