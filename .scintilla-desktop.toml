version = 1
runtime_kind = "scintilla-single-beam"
manifest = "manifests/local-runtime.json"
lockfile = "components.lock.json"

[control_plane]
daemon_url = "http://127.0.0.1:8765"
ingress_url = "http://127.0.0.1:8091"
loopback_only = true

[policy]
allow_host_workers = true
allow_container_workers = true
allowed_container_engines = ["docker", "podman"]
allowed_runtimes = ["erlang", "gleam", "rust", "typescript", "javascript", "python", "go"]
allow_mobile_agents = true
allow_remote_shell = false
allow_arbitrary_client_commands = false
