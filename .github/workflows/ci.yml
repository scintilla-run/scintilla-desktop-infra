name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_manifest.py
      - run: python -m json.tool appliance.json >/dev/null
      - run: python -m json.tool runtime/desktop-manifest.example.json >/dev/null
      - run: python tests/manifest-contract/check.py
      - run: bash -n scripts/bootstrap.sh scripts/doctor.sh
      - name: reject hard-coded component SHAs in bootstrap
        run: |
          python - <<'PY'
          import json, pathlib
          manifest=json.loads(pathlib.Path('appliance.json').read_text())
          bootstrap=pathlib.Path('scripts/bootstrap.sh').read_text()
          for item in manifest.get('components', []):
              rev=item.get('rev')
              if rev and rev in bootstrap:
                  raise SystemExit(f"bootstrap duplicates manifest SHA for {item.get('name')}")
          PY
      - name: render runtime manifest deterministically
        run: |
          python scripts/render_runtime_manifest.py --ingress-bin /bin/true --ingress-root /tmp --cloudflared-credentials /tmp/cloudflared.json --hostname test.example.com --out /tmp/runtime.json
          python -m json.tool /tmp/runtime.json >/dev/null
          grep -F '127.0.0.1:8091' /tmp/runtime.json
      - name: ensure one desired-state authority
        run: test ! -e appliance.toml
      - name: reject obvious committed secrets
        run: |
          if git grep -nEI '(api[_-]?token|password|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' -- ':!*.example'; then exit 1; else exit 0; fi
