name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_manifest.py
      - run: bash -n scripts/doctor.sh scripts/bootstrap.sh
      - name: assert incomplete appliance remains fail-closed
        run: |
          if SCINTILLA_ALLOW_INCOMPLETE=0 bash scripts/bootstrap.sh >/tmp/bootstrap.out 2>&1; then
            echo 'bootstrap unexpectedly accepted incomplete appliance'; cat /tmp/bootstrap.out; exit 1
          fi
      - name: reject obvious committed secrets
        run: |
          if git grep -nEI '(api[_-]?token|password|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' -- ':!*.example'; then exit 1; else exit 0; fi
