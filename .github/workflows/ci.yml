name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_manifest.py
      - run: python3 -m json.tool runtime/desktop-manifest.example.json >/dev/null
      - run: bash -n scripts/bootstrap.sh scripts/doctor.sh scripts/up.sh scripts/down.sh
      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/bootstrap.ps1)) | Out-Null'
      - name: Validate plist XML
        run: python3 -c 'import xml.etree.ElementTree as ET; ET.parse("services/macos/run.scintilla.desktop-daemon.plist")'
      - name: Production infra must not be a dependency
        run: |
          ! grep -R "clone.*scintilla-infra\|scintilla-run/scintilla-infra.git" -n scripts appliance.json services cloudflare runtime
      - name: Cloudflare terminates directly at loopback BEAM ingress
        run: grep -F "service: http://127.0.0.1:8083" cloudflare/config.example.yml
      - name: No mutable image/revision tokens
        run: |
          ! grep -R ':latest\|refs/heads/main' -n appliance.json runtime scripts services cloudflare
