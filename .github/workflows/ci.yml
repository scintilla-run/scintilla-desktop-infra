name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_manifest.py
      - run: python -m json.tool appliance.json >/dev/null
      - run: python -m json.tool runtime/desktop-manifest.example.json >/dev/null
      - run: python tests/manifest-contract/check.py
      - run: bash -n scripts/bootstrap.sh scripts/doctor.sh scripts/up.sh scripts/down.sh scripts/status.sh scripts/install-service.sh scripts/uninstall-service.sh
      - name: Parse PowerShell lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "scripts/bootstrap.ps1",
            "scripts/status.ps1",
            "services/windows/install.ps1",
            "services/windows/uninstall.ps1"
          )) {
            [void][scriptblock]::Create((Get-Content -Raw $path))
          }
      - name: reject hard-coded component SHAs in bootstrap
        run: |
          python - <<'PY'
          import json, pathlib
          manifest=json.loads(pathlib.Path('appliance.json').read_text())
          for bootstrap_path in ('scripts/bootstrap.sh','scripts/bootstrap.ps1'):
              bootstrap=pathlib.Path(bootstrap_path).read_text()
              for item in manifest.get('components', []):
                  rev=item.get('rev')
                  if rev and rev in bootstrap:
                      raise SystemExit(f"{bootstrap_path} duplicates manifest SHA for {item.get('name')}")
          PY
      - name: render runtime manifest deterministically
        run: |
          python scripts/render_runtime_manifest.py --ingress-bin /bin/true --ingress-root /tmp --cloudflared-credentials /tmp/cloudflared.json --hostname test.example.com --out /tmp/runtime.json
          python -m json.tool /tmp/runtime.json >/dev/null
          grep -F '127.0.0.1:8091' /tmp/runtime.json
      - name: validate persistent service wiring
        run: |
          grep -F 'SCINTILLA_DAEMON_DATA_DIR=__RUNTIME_DIR__' services/linux/scintilla-desktop-daemon.service
          grep -F 'SCINTILLA_DAEMON_FLAGS_CONFIG=__FLAGS_CONFIG__' services/linux/scintilla-desktop-daemon.service
          grep -F 'SCINTILLA_DESKTOP_MANIFEST=__MANIFEST__' services/linux/scintilla-desktop-daemon.service
          grep -F '<key>SCINTILLA_DAEMON_DATA_DIR</key><string>__RUNTIME_DIR__</string>' services/macos/run.scintilla.desktop-daemon.plist
          grep -F '<key>SCINTILLA_DAEMON_FLAGS_CONFIG</key><string>__FLAGS_CONFIG__</string>' services/macos/run.scintilla.desktop-daemon.plist
          grep -F 'SCINTILLA_DAEMON_DATA_DIR' services/windows/install.ps1
          grep -F 'SCINTILLA_DAEMON_FLAGS_CONFIG' services/windows/install.ps1
          test ! -e services/macos/com.scintilla.desktop-daemon.plist
      - name: ensure one desired-state authority
        run: test ! -e appliance.toml
      - name: reject obvious committed secrets
        run: |
          if git grep -nEI '(api[_-]?token|password|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' -- ':!*.example'; then exit 1; else exit 0; fi
