name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/manifest-contract/check.py
      - name: Shell syntax
        run: |
          sh -n scripts/bootstrap.sh
          sh -n scripts/doctor.sh
          sh -n scripts/install-user-service.sh
          sh -n scripts/uninstall-user-service.sh
