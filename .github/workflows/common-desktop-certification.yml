name: common-desktop-certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-desktop-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate immutable common-layer pin and promotion gates
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "json"
          appliance = JSON.parse(File.read("appliance.json"))
          common = appliance.fetch("common_layer")
          gates = appliance.fetch("promotion_gates")
          expected = "c98aee842535429bc07b5e4437a2fb84d8f00d25"
          abort "common repository drifted" unless common.fetch("repository") == "ORESoftware/ores-common-desktop-infra"
          abort "common layer must remain pinned" unless common.fetch("status") == "pinned"
          abort "common revision drifted" unless common.fetch("revision") == expected
          abort "pin gate must be true" unless gates.fetch("common_layer_pinned") == true
          abort "CI evidence must stay fail-closed until executable certification succeeds" unless gates.fetch("common_layer_ci_verified") == false
          RUBY

  private-checker:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: consumer
      - name: Require approved fleet read credential
        shell: bash
        env:
          FLEET_GITHUB_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLEET_GITHUB_READ_TOKEN"
      - name: Check out exact common desktop authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: c98aee842535429bc07b5e4437a2fb84d8f00d25
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
          path: consumer/tmp/dev/ores-common-desktop-infra
      - name: Execute pinned common Rust consumer checker
        working-directory: consumer
        env:
          ORES_COMMON_DESKTOP_EXPECTED_REVISION: c98aee842535429bc07b5e4437a2fb84d8f00d25
        run: |
          set -euo pipefail
          test "$(git -C tmp/dev/ores-common-desktop-infra rev-parse HEAD)" = "$ORES_COMMON_DESKTOP_EXPECTED_REVISION"
          cargo run --locked \
            --manifest-path tmp/dev/ores-common-desktop-infra/daemon/rust/Cargo.toml \
            --bin ores-common-desktop-consumer-check
