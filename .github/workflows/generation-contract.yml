name: generation-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.82.0
      - name: Validate generation lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/generation-contract-validator/Cargo.toml
          cargo run --quiet --manifest-path tools/generation-contract-validator/Cargo.toml -- ores-generation-contract.json
